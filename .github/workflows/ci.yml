name: EstateIQ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "SECRET_KEY=ci-test-secret-key-123" >> $GITHUB_ENV
          echo "ENVIRONMENT=testing" >> $GITHUB_ENV
          echo "DEBUG=False" >> $GITHUB_ENV
          echo "LOG_LEVEL=WARNING" >> $GITHUB_ENV
          echo "MODEL_PATH=model/house_price_model.pkl" >> $GITHUB_ENV
          echo "RATE_LIMIT_PER_MINUTE=1000" >> $GITHUB_ENV
          echo "RATE_LIMIT_PER_HOUR=10000" >> $GITHUB_ENV
          echo "RATE_LIMIT_PER_DAY=100000" >> $GITHUB_ENV
          echo "PORT=7860" >> $GITHUB_ENV
          echo "APP_NAME=EstateIQ" >> $GITHUB_ENV
          echo "APP_VERSION=1.0.0" >> $GITHUB_ENV

      - name: Run tests
        run: pytest

      - name: Run coverage report
        run: |
          coverage run -m pytest
          coverage report